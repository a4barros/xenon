services:
  migrate:
    build: .
    command: python migrate.py
    environment:
      DATABASE_URL: postgresql://xenon:xenon@db:5432/xenon
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://xenon:xenon@db:5432/xenon
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: xenon
      POSTGRES_USER: xenon
      POSTGRES_PASSWORD: xenon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xenon -d xenon"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

volumes:
  postgres_data:

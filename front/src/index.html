<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>[Xenon] Vault</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./style.css" rel="stylesheet">
</head>

<body class="bg-custom">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand h1" href="index.html">Xenon</a>
        <button id="logout" class="btn btn-outline-light ms-auto" type="button">Log out</button>
    </nav>
    <main class="container py-5">
        <div class="mx-auto vault-container">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <h1 class="h2 mb-0">Your vault</h1>
                <button id="addSecret" class="btn btn-primary" type="button" hidden>Add secret</button>
            </div>
            <section id="unlockPanel" class="card border-0">
                <div class="card-body p-4">
                    <h2 class="h4 mb-3">Unlock your vault</h2>
                    <form id="unlockForm">
                        <div class="mb-3">
                            <label for="vaultPassword" class="form-label">Vault password</label>
                            <input type="password" class="form-control" id="vaultPassword" name="vaultPassword"
                                placeholder="Enter vault password" autocomplete="current-password" required>
                        </div>
                        <p id="vaultError" class="text-danger" role="alert" hidden></p>
                        <button id="unlock" class="btn btn-primary" type="submit">Unlock vault</button>
                    </form>
                </div>
            </section>
            <p id="vaultStatus" class="mt-3 text-danger" role="alert" hidden></p>
            <section id="secretEditor" class="card border-0 mt-4" hidden>
                <div class="card-body p-4">
                    <h2 id="editorTitle" class="h4 mb-3">Add secret</h2>
                    <form id="secretForm">
                        <div class="mb-3">
                            <label for="secretName" class="form-label">Name</label>
                            <input id="secretName" name="name" class="form-control" maxlength="200" required>
                        </div>
                        <div class="mb-3">
                            <label for="secretUsername" class="form-label">Username</label>
                            <input id="secretUsername" name="username" class="form-control" autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label for="secretPassword" class="form-label">Password</label>
                            <input id="secretPassword" name="password" type="password" class="form-control"
                                autocomplete="new-password">
                        </div>
                        <div class="mb-3">
                            <label for="secretTotpKey" class="form-label">TOTP key</label>
                            <input id="secretTotpKey" name="totpKey" class="form-control" autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label for="secretNotes" class="form-label">Notes</label>
                            <textarea id="secretNotes" name="notes" class="form-control" rows="3"></textarea>
                        </div>
                        <p id="editorError" class="text-danger" role="alert" hidden></p>
                        <div class="d-flex gap-2">
                            <button id="saveSecret" class="btn btn-primary" type="submit">Save secret</button>
                            <button id="cancelEdit" class="btn btn-outline-light" type="button">Cancel</button>
                        </div>
                    </form>
                </div>
            </section>
            <section id="vaultContents" class="mt-4" aria-live="polite"></section>
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>

</html>

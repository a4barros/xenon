<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>[Xenon] Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./style.css" rel="stylesheet">
</head>

<body class="bg-custom">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <span class="navbar-brand ml-6 h1">[Xenon]</span>
    </nav>
    <div class="container py-5 d-flex justify-content-center">
        <div class="card shadow-sm border-0"
            style="width: 100%; max-width: 420px; background-color: rgba(15, 23, 42, 0.9);">
            <div class="card-body p-4">
                <h1 class="h3 mb-4 text-center">Login</h1>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username"
                        placeholder="Enter username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="Enter password">
                </div>
                <div class="mb-4">
                    <label for="vaultPassword" class="form-label">Vault password</label>
                    <input type="password" class="form-control" id="vaultPassword" name="vaultPassword"
                        placeholder="Enter vault password">
                </div>
                <button type="submit" id="login" class="btn btn-primary w-100">Login</button>
            </div>
        </div>
    </div>
    <script type="module" src="js/login.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>[Xenon] Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./style.css" rel="stylesheet">
</head>

<body class="bg-custom">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand h1" href="index.html">Xenon</a>
    </nav>
    <main class="container py-5 d-flex justify-content-center">
        <div class="card shadow-sm border-0 auth-card">
            <div class="card-body p-4">
                <h1 class="h3 mb-4 text-center">Login</h1>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username"
                            placeholder="Enter username" autocomplete="username" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Enter password" autocomplete="current-password" required>
                    </div>
                    <p id="loginError" class="text-danger" role="alert" hidden></p>
                    <button type="submit" id="login" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-4 mb-0">New to Xenon? <a href="createAccount.html">Create an account</a></p>
            </div>
        </div>
    </main>
    <script type="module" src="js/login.js"></script>
</body>

</html>

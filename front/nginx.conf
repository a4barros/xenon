server {
    include mime.types;
    default_type application/octet-stream;

    listen 9000;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        if ($request_uri ~ ^/(.*)\.html(\?|$)) {
            return 302 /$1;
        }
        try_files $uri $uri.html $uri/ =404;
    }
}

server_tokens off;